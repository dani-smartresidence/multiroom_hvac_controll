blueprint:
  name: Watchdog controler încălzire (Room Climate Portal)
  description: >-
    Dacă add-on-ul Room Climate Portal nu mai publică semnalul de funcționare în timp ce comută
    circuitele centralelor, repornește automatizările pe care le-a preluat, ca automatizările tale să
    conducă din nou clădirea, și afișează o notificare. Automatizările se citesc din semnal. După o
    repornire a Home Assistant semnalul revine doar când rulează din nou add-on-ul: dacă tot lipsește
    după minutele setate, sunt repornite automatizările de rezervă.
  domain: automation
  source_url: https://github.com/dani-smartresidence/multiroom_hvac_controll/blob/main/blueprints/automation/heating_watchdog.yaml
  input:
    heartbeat:
      name: Senzorul semnalului de funcționare
      default: sensor.heating_controller_heartbeat
      selector:
        entity:
          filter:
            - domain: sensor
    stale_minutes:
      name: Minute fără semnal
      default: 15
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: min
    fallback:
      name: Automatizări de rezervă
      description: >-
        Repornite când semnalul lipsește complet după o repornire. Alege aceleași automatizări pe care
        centralele le preiau în add-on.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: automation

mode: single

triggers:
  - trigger: time_pattern
    minutes: "/5"
    id: tick
  - trigger: homeassistant
    event: start
    id: start

variables:
  hb: !input heartbeat
  stale: !input stale_minutes
  fallback: !input fallback
  autos: "{{ state_attr(hb, 'takeover_automations') or [] }}"
  last: >-
    {% set s = states[hb] %}
    {% set t = as_datetime(s.state, none) if s and s.state not in ['unknown', 'unavailable'] else none %}
    {{ (t or (s.last_changed if s else now())) | string }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - wait_template: "{{ states[hb] is not none and states(hb) not in ['unknown', 'unavailable'] }}"
            timeout:
              minutes: !input stale_minutes
          - if:
              - condition: template
                value_template: "{{ not wait.completed and fallback | count > 0 }}"
            then:
              - action: automation.turn_on
                target:
                  entity_id: "{{ fallback }}"
              - action: persistent_notification.create
                data:
                  notification_id: heating_watchdog
                  title: Controlerul de încălzire nu a pornit
                  message: >-
                    Add-on-ul Room Climate Portal nu a dat semn de viață la {{ stale }} minute după pornirea
                    Home Assistant. Aceste automatizări au fost repornite: {{ fallback | join(', ') }}.
      - conditions:
          - condition: trigger
            id: tick
          - condition: template
            value_template: "{{ autos | count > 0 and as_datetime(last) < now() - timedelta(minutes=stale | int) }}"
          - condition: template
            value_template: "{{ expand(autos) | selectattr('state', 'eq', 'off') | list | count > 0 }}"
        sequence:
          - action: automation.turn_on
            target:
              entity_id: "{{ autos }}"
          - action: persistent_notification.create
            data:
              notification_id: heating_watchdog
              title: Controlerul de încălzire s-a oprit
              message: >-
                Add-on-ul Room Climate Portal nu a mai dat semn de viață de la {{ as_timestamp(last) | timestamp_custom('%H:%M') }}.
                Aceste automatizări au fost repornite: {{ autos | join(', ') }}.
                Verifică add-on-ul, apoi pune din nou centralele pe Activ din tab-ul Instalație.
