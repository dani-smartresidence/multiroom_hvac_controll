configuration:
  public_url:
    name: Public URL
    description: Address phones use, without the path, e.g. https://ha.voxdomini.ro. QR codes point to <public_url><base_path>/<code>.
  base_path:
    name: Base path
    description: Path all room pages live under, e.g. /camera. Your reverse proxy forwards this path to the add-on's port 8080.
  default_language:
    name: Default page language
    description: Language the room page opens in. Guests can switch between Romanian and English.
  room_label:
    name: Room label
    description: HA label put on each Area that should get a QR page.
  lead_time_label:
    name: Lead-time label
    description: HA label on the entity (sensor / input_number) that holds the precondition lead time in minutes for that room.
  outdoor_sensor:
    name: Outdoor temperature sensor
    description: Optional sensor shown as "Exterior" on every room page.
  min_temp:
    name: Minimum setpoint
    description: Lowest temperature guests may set (°C). Can be overridden per room.
  max_temp:
    name: Maximum setpoint
    description: Highest temperature guests may set (°C). Can be overridden per room.
  temp_step:
    name: Setpoint step
    description: Step of the + / - buttons (°C).
  default_target_temp:
    name: Default event target
    description: Target temperature shown for an event when its description has no "target:" line.
  default_lead_minutes:
    name: Default lead time
    description: Minutes used when a room has no lead-time entity.
  schedule_days:
    name: Days of schedule
    description: How many days ahead the room page lists events.
  allow_mode_change:
    name: Allow mode change
    description: Let guests change HVAC mode (otherwise only the setpoint).
  publish_precondition_sensors:
    name: Publish precondition sensors
    description: Create sensor.<room>_next_precondition (timestamp) in HA so automations can start preconditioning at exactly the time the page shows.
  rate_limit_seconds:
    name: Seconds between changes per room
  max_changes_per_hour:
    name: Max changes per hour per phone
  trust_proxy_headers:
    name: Trust X-Forwarded-For
    description: Enable only when the guest port sits behind your own reverse proxy.
  help_text:
    name: Help text
    description: Shown on the "code no longer active" page, e.g. "Întrebați la recepție sau sunați la interiorul 100."
  pin_remember_hours:
    name: Remember PIN (hours)
    description: How long a phone stays unlocked after entering the room PIN. PINs are set per room on the admin page.
  pin_max_attempts:
    name: Wrong PIN attempts before lockout
  pin_lockout_minutes:
    name: Lockout (minutes)
  hold_default_minutes:
    name: Manual heating default length (minutes)
    description: When a guest starts heating or changes the temperature from the room page, it turns itself off after this long unless they pick another end time.
  hold_max_hours:
    name: Longest manual heating period (hours)
  hold_end_action:
    name: When manual heating ends
    description: "off turns the thermostat off; setback keeps it on at the setback temperature. Nothing changes if a calendar event is preconditioning or running in that room."
  setback_temp:
    name: Setback temperature (°C)
network:
  8080/tcp: Guest pages opened from the room QR codes
