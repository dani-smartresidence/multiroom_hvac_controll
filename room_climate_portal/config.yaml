name: Room Climate Portal
version: "0.5.0"
slug: room_climate_portal
description: Per-room thermostat pages opened by scanning a QR code in each room
url: https://github.com/dani-smartresidence/multiroom_hvac_controll
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:qrcode-scan
panel_title: Room QR
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Guest pages opened from the room QR codes
map:
  - addon_config:rw
options:
  public_url: "https://ha.example.ro"
  base_path: /camera
  default_language: ro
  room_label: qr_room
  lead_time_label: precondition_lead
  outdoor_sensor: ""
  min_temp: 18
  max_temp: 25
  temp_step: 0.5
  default_target_temp: 21
  default_lead_minutes: 45
  schedule_days: 7
  allow_mode_change: false
  publish_precondition_sensors: true
  rate_limit_seconds: 3
  max_changes_per_hour: 60
  trust_proxy_headers: false
  help_text: "Întrebați la recepție."
  pin_remember_hours: 24
  pin_max_attempts: 5
  pin_lockout_minutes: 10
  hold_default_minutes: 120
  hold_max_hours: 12
  hold_end_action: "off"
  setback_temp: 16
  restore_after_events: true
schema:
  public_url: url
  base_path: str
  default_language: list(ro|en)
  room_label: str
  lead_time_label: str
  outdoor_sensor: str?
  min_temp: float
  max_temp: float
  temp_step: float
  default_target_temp: float
  default_lead_minutes: int(0,600)
  schedule_days: int(1,31)
  allow_mode_change: bool
  publish_precondition_sensors: bool
  rate_limit_seconds: int(0,60)
  max_changes_per_hour: int(1,10000)
  trust_proxy_headers: bool
  help_text: str?
  pin_remember_hours: int(1,720)
  pin_max_attempts: int(1,20)
  pin_lockout_minutes: int(1,1440)
  hold_default_minutes: int(15,720)
  hold_max_hours: int(1,24)
  hold_end_action: list(off|setback)
  setback_temp: float(5,25)
  restore_after_events: bool
